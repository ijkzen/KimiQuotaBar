name: Release

# 打 Tag（如 v0.1.0）后自动构建 .app 并发布 GitHub Release，
# 发布说明自动生成：自上一版本以来的提交日志 + 手动补充说明（tag 消息的 Release Notes 段落）。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and package .app
        run: make package

      - name: Archive app bundle
        run: |
          cd .build && zip -rq KimiQuotaBar-${{ github.ref_name }}.zip KimiQuotaBar.app

      - name: Generate release notes
        id: notes
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # 上一版本 tag：无则回退到最早的提交
          PREVIOUS=$(git describe --tags --abbrev=0 ${REF_NAME}^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          echo "Previous tag: $PREVIOUS"

          # 提交日志：按类型分组（无类型前缀的归入「其他」）
          TMP=$(mktemp)
          git log --pretty=format:'%s' ${PREVIOUS}..${REF_NAME} | sort -u > "$TMP"

          # 按类型分组写入发布说明文件
          NOTES=/tmp/release_notes.md
          printf '## 变更日志（自 %s 以来）\n\n' "$PREVIOUS" > "$NOTES"
          write_group() {
            local name="$1" pattern="$2"
            local lines
            lines=$(grep -iE "$pattern" "$TMP" | sed -E 's/^[^:)]*[):] *//I' || true)
            if [ -n "$lines" ]; then
              printf '### %s\n\n' "$name" >> "$NOTES"
              printf '%s\n' "$lines" | sed 's/^/- /' >> "$NOTES"
              printf '\n' >> "$NOTES"
            fi
          }
          write_group '✨ 新功能' '^(feat|feature|新增|支持|添加|feat\()'
          write_group '🐛 修复' '^(fix|修复|fix\()'
          write_group '♻️ 重构' '^(refactor|重构)'
          write_group '⚙️ 其他' '^[^|]*(chore|ci|docs|test|perf|build|其他|文档|测试|性能)[^|]*|^(chore|ci|docs|test|perf|build)[:(]'
          # 兜底：仍未分类的行
          REMAIN=$(grep -viE '^(feat|fix|refactor|chore|ci|docs|test|perf|build|新增|支持|添加|修复|重构)' "$TMP" || true)
          if [ -n "$REMAIN" ]; then
            printf '### 其他\n\n' >> "$NOTES"
            printf '%s\n' "$REMAIN" | sed 's/^/- /' >> "$NOTES"
            printf '\n' >> "$NOTES"
          fi
          rm -f "$TMP"

          # 手动补充说明：tag 消息中的 Release Notes 段落（通过 GitHub API 读取 annotated tag，
          # 避免浅克隆下本地 tag 可能只是 lightweight 指针、注释消息缺失的问题）
          TAG_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${REF_NAME}" --jq '.object.sha')"
          TAG_MSG="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_SHA}" --jq '.message')"
          BODY="$(printf '%s' "$TAG_MSG" | awk '/^Release Notes/,0' | sed '1d')"
          if [ -z "$BODY" ]; then
            BODY="$(printf '%s' "$TAG_MSG" | head -1)"
          fi
          if [ -n "$BODY" ]; then
            printf '## 发布说明\n\n%s\n' "$BODY" >> "$NOTES"
          else
            printf '## 发布说明\n\n（未提供，见上方变更日志）\n' >> "$NOTES"
          fi
          echo "Notes preview:"
          head -c 2000 "$NOTES"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: KimiQuotaBar ${{ github.ref_name }}
          body_path: /tmp/release_notes.md
          files: .build/KimiQuotaBar-${{ github.ref_name }}.zip
          draft: false
          prerelease: false
